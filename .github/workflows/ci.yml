name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npx prettier --check .
        working-directory: frontend

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: scripd_test
          POSTGRES_USER: scripd
          POSTGRES_PASSWORD: scripd_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scripd -d scripd_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: scripd_test
      DB_USER: scripd
      DB_PASSWORD: scripd_test_password
      DB_SSLMODE: disable
      JWT_ACCESS_SECRET: test-only-secret-do-not-use-outside-ci-000000000000
      TEST_DATABASE_URL: postgres://scripd:scripd_test_password@localhost:5432/scripd_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
          cache: true
      - run: go test -race -coverprofile=coverage.out ./cmd/... ./internal/...

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: false
          tags: scripd-api:ci
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: scripd-web:ci
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:8080
