version: "2"
run:
  timeout: 5m
  tests: true
linters:
  default: standard
  enable:
    - bodyclose
    - dupl
    - errcheck
    - gocritic
    - gosec
    - misspell
    - nilerr
    - revive
    - unconvert
    - wastedassign
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
  exclusions:
    presets:
      - std-error-handling
    rules:
      - linters:
          - gosec
        text: "G124:"
      - linters:
          - gosec
        text: "G304:"
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
