version: "2"
run:
  timeout: 5m
  tests: true
linters:
  default: standard
  enable:
    - bodyclose
    - dupl
    - errcheck
    - gocritic
    - gosec
    - misspell
    - nilerr
    - revive
    - unconvert
    - wastedassign
  exclusions:
    presets:
      - std-error-handling
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/scripd-app/scripd
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
