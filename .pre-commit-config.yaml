repos:
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: gofmt -w
        language: system
        types: [go]
      - id: frontend-eslint
        name: frontend eslint
        entry: npm --prefix frontend run lint
        language: system
        files: ^frontend/.*\.(js|jsx|ts|tsx)$
        pass_filenames: false
      - id: frontend-prettier
        name: frontend prettier
        entry: npm --prefix frontend exec -- prettier --check .
        language: system
        files: ^frontend/
        pass_filenames: false
